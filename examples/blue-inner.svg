<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#F7F8FC"/>
  <rect x="72" y="76" width="196" height="52" rx="26" fill="#EAF0FF"/>
  <text x="104" y="111" font-family="PingFang SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#1E60FF">评测框架</text>
  <text x="72" y="236" font-family="PingFang SC,Arial,sans-serif" font-size="78" font-weight="800" fill="#111827">三层指标缺一不可</text>
  <text x="72" y="302" font-family="PingFang SC,Arial,sans-serif" font-size="32" fill="#5B6475">只测答案准确率，定位不了系统问题</text>
  <rect x="72" y="380" width="936" height="218" rx="24" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="2"/>
  <circle cx="136" cy="444" r="30" fill="#1E60FF"/><text x="126" y="456" font-family="Arial" font-size="28" font-weight="700" fill="#FFF">1</text>
  <text x="190" y="456" font-family="PingFang SC,Arial,sans-serif" font-size="38" font-weight="700" fill="#111827">检索层</text>
  <text x="112" y="520" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#5B6475">关注召回率、相关性和上下文覆盖，判断资料有没有找对。</text>
  <rect x="72" y="630" width="936" height="218" rx="24" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="2"/>
  <circle cx="136" cy="694" r="30" fill="#1E60FF"/><text x="126" y="706" font-family="Arial" font-size="28" font-weight="700" fill="#FFF">2</text>
  <text x="190" y="706" font-family="PingFang SC,Arial,sans-serif" font-size="38" font-weight="700" fill="#111827">生成层</text>
  <text x="112" y="770" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#5B6475">检查忠实度、完整性与引用一致性，判断答案有没有说对。</text>
  <rect x="72" y="880" width="936" height="218" rx="24" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="2"/>
  <circle cx="136" cy="944" r="30" fill="#1E60FF"/><text x="126" y="956" font-family="Arial" font-size="28" font-weight="700" fill="#FFF">3</text>
  <text x="190" y="956" font-family="PingFang SC,Arial,sans-serif" font-size="38" font-weight="700" fill="#111827">端到端</text>
  <text x="112" y="1020" font-family="PingFang SC,Arial,sans-serif" font-size="29" fill="#5B6475">用任务成功率和用户反馈判断最终体验是否真正可用。</text>
  <rect x="72" y="1150" width="936" height="96" rx="20" fill="#EAF0FF"/>
  <text x="112" y="1211" font-family="PingFang SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#1E60FF">先分层定位，再看整体结果。</text>
  <line x1="72" y1="1280" x2="1008" y2="1280" stroke="#D5DCE8" stroke-width="2"/>
  <text x="916" y="1360" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1E60FF">02/05</text>
</svg>
