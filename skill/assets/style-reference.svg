<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">小红书干货卡片通用视觉参考</title>
  <desc id="desc">三比四竖版、科技蓝主色、三级文字层级、模块卡片、可选署名和统一页码。</desc>
  <rect width="1080" height="1440" fill="#F7F8FC"/>
  <rect x="72" y="70" width="236" height="52" rx="26" fill="#EAF0FF"/>
  <text x="104" y="105" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#1E60FF">知识卡片示例</text>
  <text x="72" y="220" font-family="PingFang SC, sans-serif" font-size="90" font-weight="800" fill="#111827">从零散笔记</text>
  <text x="72" y="326" font-family="PingFang SC, sans-serif" font-size="90" font-weight="800" fill="#111827">到清晰卡片</text>
  <text x="72" y="392" font-family="PingFang SC, sans-serif" font-size="34" fill="#5B6475">一页讲透一个知识模块</text>
  <rect x="72" y="470" width="448" height="300" rx="20" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="2"/>
  <circle cx="130" cy="538" r="26" fill="#1E60FF"/>
  <text x="121" y="548" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">1</text>
  <text x="176" y="548" font-family="PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#111827">结论先行</text>
  <text x="112" y="620" font-family="PingFang SC, sans-serif" font-size="28" fill="#5B6475">先给读者一句可独立成立的</text>
  <text x="112" y="664" font-family="PingFang SC, sans-serif" font-size="28" fill="#5B6475">核心判断，再补充解释。</text>
  <rect x="560" y="470" width="448" height="300" rx="20" fill="#FFFFFF" stroke="#D5DCE8" stroke-width="2"/>
  <circle cx="618" cy="538" r="26" fill="#1E60FF"/>
  <text x="609" y="548" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">2</text>
  <text x="664" y="548" font-family="PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#111827">结构匹配</text>
  <text x="600" y="620" font-family="PingFang SC, sans-serif" font-size="28" fill="#5B6475">根据并列、流程、对比或因果</text>
  <text x="600" y="664" font-family="PingFang SC, sans-serif" font-size="28" fill="#5B6475">关系选择对应的版式。</text>
  <rect x="72" y="820" width="936" height="252" rx="20" fill="#EAF0FF" stroke="#B9CAFF" stroke-width="2"/>
  <text x="112" y="900" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#1E60FF">配置项</text>
  <text x="112" y="964" font-family="PingFang SC, sans-serif" font-size="30" fill="#111827">署名可留空，主色和尺寸可按项目替换。</text>
  <path d="M112 1004 C290 1020 478 994 724 1006" fill="none" stroke="#1E60FF" stroke-width="8" stroke-linecap="round"/>
  <line x1="72" y1="1260" x2="1008" y2="1260" stroke="#D5DCE8" stroke-width="2"/>
  <text x="72" y="1330" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#111827">署名区域（可选）</text>
  <text x="892" y="1338" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1E60FF">01/05</text>
</svg>
